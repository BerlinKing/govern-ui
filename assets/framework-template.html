<script>
const catalog=JSON.parse(document.querySelector('#framework-catalog').textContent);
const input=JSON.parse(document.querySelector('#framework-input').textContent);
const KEY=input.storageKey||'governui-framework-'+input.project+'-v2';
const clone=x=>structuredClone(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={undecided:['待选择','Undecided'],adopt:['采用','Adopt'],unused:['暂不使用','Unused'],defer:['稍后决定','Defer'],define:['定义语义 Token','1 Define roles'],bind:['2 绑定样式','2 Bind styles'],locked:['已确认','Confirmed'],draft:['草稿','Draft'],edit:['编辑','Edit'],save:['保存','Save'],cancel:['取消','Cancel'],binding:['绑定样式','Bind style'],revision:['创建新修订','Create revision'],confirm:['确认本类决策','Confirm category decision'],reason:['选择理由','Decision reason'],pending:['尚未绑定','Not bound'],export:['导出完整框架','Export full framework'],manual:['导出设计手册','Export design manual'],add:['添加语义 Token','Add role'],remove:['删除','Delete'],undo:['撤销删除','Undo delete'],observed:['本次摸底已发现','Detected in this scope'],missing:['本次摸底未发现','Not detected in this scope'],unverified:['尚未核查','Unverified'],evidence:['使用证据','Usage evidence'],history:['确认记录','Confirmed versions'],diff:['查看修订差异','Review revision changes']};
function blankCategory(c){return {id:c.id,adoption:'undecided',reason:'',rule:clone(c.rule),version:1,stage:'define',locked:false,rows:c.roles.map(r=>({...clone(r),scope:['项目共享（待确认）','Project shared (proposed)'],binding:null,custom:false})),history:[],removedRows:[]}}
function initial(){const s={schema:'governui.framework/2',selectionModel:'presence',legacyRoleSelectionRecord:null,catalogSchema:catalog.schema,project:input.project,baseline:input.baseline,scope:input.scope,lang:'zh',categories:catalog.categories.map(blankCategory),legacyColorRecord:null};const color=s.categories.find(c=>c.id==='color');for(const row of input.colorSeed||[]){const current=color.rows.find(x=>x.id===row.id);const r={id:row.id,name:row.name,label:current?.label||[row.name,row.name],meaning:[row.meaning,row.meaningEn||row.meaning],location:[row.location,row.locationEn||row.location],scope:[row.scope,row.scopeEn||row.scope],binding:null,candidate:row.candidate,custom:!current,legacyGroup:row.group};if(current)Object.assign(current,r);else color.rows.push(r)}return s}
function importLegacy(s,old){s.legacyColorRecord=clone(old);const color=s.categories.find(c=>c.id==='color');color.version=(Number.isInteger(old.version)?old.version:1)+1;for(const row of old.rows){const current=color.rows.find(r=>r.id===row.id);const b=row.binding;const next={id:row.id,name:row.name,label:current?.label||[row.name,row.name],meaning:[row.meaning,row.meaningEn||row.meaning],location:[row.location,row.locationEn||row.location],scope:[row.scope,row.scopeEn||row.scope],candidate:row.candidate,custom:!current,legacyGroup:row.group,binding:b?{values:{light:b.light,dark:b.dark},owner:b.owner,ownerStatus:b.sourceId==='custom'?'proposed':'source-reference',sourceId:b.sourceId,sourceEvidence:b.sourceEvidence||null}:null};if(current)Object.assign(current,next);else color.rows.push(next)}s.lang=old.lang==='en'?'en':'zh'}
let state=initial(),storageOK=true,loadIssue=false;
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved.schema==='governui.framework/2'&&saved.baseline===input.baseline&&saved.project===input.project&&Array.isArray(saved.categories)&&saved.categories.every(c=>Array.isArray(c.rows)&&Array.isArray(c.history))){const originalSaved=clone(saved);state.defaultsVersion=saved.defaultsVersion||0;for(const c of state.categories){const existing=saved.categories.find(x=>x.id===c.id);if(existing){Object.assign(c,existing);c.removedRows=existing.removedRows||[];if(saved.selectionModel!=='presence'){if(c.locked&&c.adoption==='adopt'&&c.rows.some(r=>!r.included)){c.locked=false;c.version++;c.stage='define'}for(const r of c.rows)delete r.included}}}state.lang=saved.lang==='en'?'en':'zh';state.legacyColorRecord=saved.legacyColorRecord||null;state.legacyRoleSelectionRecord=saved.selectionModel==='presence'?(saved.legacyRoleSelectionRecord||null):originalSaved}else loadIssue=true}else if(input.legacyStorageKey){const old=JSON.parse(localStorage.getItem(input.legacyStorageKey));if(old?.schema==='governui.framework-prototype/1'&&Array.isArray(old.rows)&&old.project===input.project)importLegacy(state,old)}}catch{storageOK=false;loadIssue=true}
// Backfill existing drafts once; preserve intentional removals and confirmed snapshots.
if(!state.defaultsVersion){for(const c of state.categories){if(c.locked)continue;for(const row of c.rows){if(row.binding)continue;const src=(input.generatedStyles||[]).find(s=>s.roleName===row.name);if(src)row.binding={values:clone(src.values),owner:src.owner,ownerStatus:'proposed',sourceId:src.id,sourceName:src.name,sourceEvidence:clone(src.evidence),displayValues:clone(src.displayValues),iconGeometry:src.iconGeometry||null};}}state.defaultsVersion=1;}
let atom='color',restoreFocus;
if(new URL(location.href).searchParams.get('step')==='binding'&&!['unused','defer'].includes(state.categories.find(c=>c.id===atom).adoption))state.categories.find(c=>c.id===atom).stage='bind';
const tr=x=>Array.isArray(x)?x[state.lang==='zh'?0:1]:x,t=k=>tr(labels[k]||[k,k]);
const def=()=>catalog.categories.find(c=>c.id===atom),cat=()=>state.categories.find(c=>c.id===atom);
const button=(action,label,attrs='')=>`<button type="button" data-action="${action}" ${attrs}>${label}</button>`;
function persist(){if(loadIssue)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch{storageOK=false}}
function observation(id){return input.observations?.[id]||{status:'unverified',count:0,samples:[]}}
function obsLabel(o){return t(o.status==='detected'?'observed':o.status==='not-detected-in-scope'?'missing':'unverified')}
function complete(c){if(c.adoption==='unused'||c.adoption==='defer')return !!c.reason.trim();return c.adoption==='adopt'&&c.rows.length>0&&c.rows.every(r=>r.binding)}
function snapshot(c){const {history,...record}=c;return clone(record)}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.querySelector('#lang').textContent=state.lang==='zh'?'EN':'中文';document.querySelector('#export').textContent=t('export');document.querySelector('#manual').textContent=t('manual');document.querySelectorAll('[data-i]').forEach(n=>{const texts={recon:['1 项目摸底','1 Reconnaissance'],framework:['2 定义框架','2 Framework'],batches:['3 分批治理','3 Batches'],verify:['4 验证交付','4 Verification']};n.textContent=tr(texts[n.dataset.i])});
 document.querySelector('#nav').innerHTML=`<p class="label">${esc(input.project)} · ${catalog.categories.length} ${tr(['原子类别','atomic categories'])}</p>`+catalog.categories.map(d=>{const c=state.categories.find(x=>x.id===d.id);return `<button data-atom="${d.id}" class="${atom===d.id?'active':''}" ${atom===d.id?'aria-current="page"':''}>${esc(tr(d.label))}<small>${t(c.adoption)}${c.locked?' · '+t('locked'):''}</small></button>`}).join('')+`<p class="label evidence-label">${tr(['摸底记录','Reconnaissance'])}</p><button data-atom="unclassified" class="${atom==='unclassified'?'active':''}">${tr(['未归类值','Unclassified values'])}</button>`;
 const main=document.querySelector('#main');if(atom==='unclassified'){const o=observation('unclassified');main.innerHTML=`<h1>${tr(['未归类值','Unclassified values'])}</h1><p>${tr(['这里保留尚未明确用途的来源记录；确认含义后归入已有原子类别。','Keep unresolved source records here; classify into atomic categories when their purpose is known.'])}</p>${evidenceHTML(o)}`;return}

 const refreshPreview=()=>{const draft=current(),src=source(),changed=src&&d.fields.some(f=>(draft.values[f.id]||'')!==(src.values[f.id]||''));const resolved=previewValues(draft.values,src,mode);document.querySelector('#binding-preview').innerHTML=specimen(d.id,draft.values,src,mode)+`<div class="resolved-values">${d.fields.filter(f=>resolved[f.id]&&resolved[f.id]!==draft.values[f.id]).map(f=>`<p><span>${esc(tr(f.label))} · ${tr(['解析值','Resolved'])}</span><code>${esc(resolved[f.id])}</code></p>`).join('')}</div>`;const count=d.fields.filter(f=>draft.values[f.id]).length;document.querySelector('#binding-status').textContent=count<d.fields.length?tr(['请补齐剩余字段，再确认绑定。','Complete the remaining fields before confirming.']):changed?tr(['已调整为目标样式，原始来源记录保持不变。','Adjusted target style; original source evidence is preserved.']):src?tr(['当前目标与所选来源一致。','The target matches the selected source.']):tr(['自定义目标，尚未写入项目源码。','Custom target; not written to application source.']);document.querySelector('#mode-controls').innerHTML=src?.modePreviews&&d.id!=='color'?['light','dark'].map(m=>button('preview-mode',m==='light'?'Light':'Dark',`data-mode="${m}" class="quiet ${mode===m?'mode-active':''}"`)).join(''):'';const play=document.querySelector('[data-action="play-style"]');if(play)play.onclick=()=>{const dot=document.querySelector('.motion-dot');if(!dot)return;const ms=/ms$/.test(draft.values.duration)?parseFloat(draft.values.duration):parseFloat(draft.values.duration)*1000;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;dot.animate(reduced?[{opacity:0},{opacity:1}]:[{transform:'translateX(0)',opacity:.4},{transform:'translateX(100px)',opacity:1}],{duration:reduced?1:Math.min(4000,Math.max(1,ms||250)),easing:CSS.supports('transition-timing-function',draft.values.easing||'')?draft.values.easing:'linear',fill:'forwards'})}};
 const editor=()=>{const draft=current(),src=source();document.querySelector('#binding-fields').innerHTML=`<div class="typed-fields">${d.fields.map(f=>typedField(f,draft.values[f.id]||'')).join('')}</div>${field(tr(['样式来源 / 计划定义位置','Style owner / planned definition location']),'b-owner',draft.owner)}${src?`<details class="binding-evidence"><summary>${tr(['查看原始来源','View original source'])}</summary>${sourceEvidenceHTML(src)}</details>`:''}`;for(const f of d.fields){const el=document.querySelector('#b-'+f.id);el.readOnly=c.locked;el.oninput=()=>{draft.values[f.id]=el.value;const picker=document.querySelector('#picker-'+f.id);if(picker&&/^#[0-9a-f]{6}(?:[0-9a-f]{2})?$/i.test(el.value))picker.value=el.value.slice(0,7);refreshPreview()};const picker=document.querySelector('#picker-'+f.id);if(picker){picker.disabled=c.locked;picker.oninput=()=>{const alpha=/^#[0-9a-f]{8}$/i.test(el.value)?el.value.slice(7):'';el.value=picker.value+alpha;el.dispatchEvent(new Event('input'))}}}const owner=document.querySelector('#b-owner');owner.readOnly=c.locked;owner.oninput=()=>{draft.owner=owner.value};refreshPreview()};
 list();editor();for(const el of document.querySelectorAll('[id^="token-"]'))el.readOnly=c.locked;document.querySelector('#source-search').oninput=list;document.querySelector('#source-list').onclick=ev=>{const b=ev.target.closest('[data-source]');if(!b||c.locked)return;choice=b.dataset.source;list();editor()};document.querySelector('#mode-controls').onclick=ev=>{const b=ev.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;list();refreshPreview()};
 document.querySelector('[data-action="clear-binding"]')?.addEventListener('click',()=>{if(c.locked)return;r.binding=null;persist();close();render()});
 document.querySelector('#binding-form').onsubmit=ev=>{ev.preventDefault();if(c.locked)return;const values=Object.fromEntries(d.fields.map(f=>[f.id,(current().values[f.id]||'').trim()])),owner=current().owner.trim(),invalid=d.fields.find(f=>!validValue(f,values[f.id]));if(invalid||!owner){document.querySelector('#error').textContent=invalid?tr(['请检查字段：','Check field: '])+tr(invalid.label):tr(['请填写样式来源或计划定义位置。','Enter a style owner or planned definition location.']);return}const edits=Object.fromEntries(['label','name','meaning','location','scope'].map(k=>[k,document.querySelector('#token-'+k).value.trim()]));if(Object.values(edits).some(v=>!v)||!/^--[a-z][a-z0-9-]*$/.test(edits.name)||state.categories.some(cat=>cat.rows.some(row=>row!==r&&row.name===edits.name))){document.querySelector('#error').textContent=tr(['请补齐定义，Token 名称必须唯一且以 -- 开头。','Complete definitions and use a unique -- token name.']);return}r.name=edits.name;for(const k of ['label','meaning','location','scope'])if(edits[k]!==tr(r[k]))r[k]=[edits[k],edits[k]];const src=source(),matches=src&&owner===src.owner&&d.fields.every(f=>values[f.id]===src.values[f.id]);const displayValues=previewValues(values,src),modePreviews=src?.modePreviews?Object.fromEntries(Object.keys(src.modePreviews).map(m=>[m,previewValues(values,src,m)])):undefined;r.binding={values,owner,ownerStatus:matches?'source-reference':'proposed',sourceId:src?.id||'custom',sourceName:src?.name||tr(['自定义样式','Custom style']),sourceEvidence:src?clone(src):null,sourceExpressions:src?.expressions||null,displayValues,modePreviews,iconGeometry:src?.iconGeometry&&values.source===src.values.source?clone(src.iconGeometry):null};if(adding)c.rows.push(r);persist();close();render()}
}

function download(value,filename,mime='application/json'){const blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportRecord(){return {...clone(state),catalog:clone(catalog),observations:clone(input.observations||{}),bindingEvidenceBaseline:clone(input.bindingEvidenceBaseline||null),exportedAt:new Date().toISOString(),authorization:'framework-only-no-code-writes'}}
function manual(){const lines=[`# ${input.project} — ${tr(['设计原子框架','Atomic design framework'])}`,'',`${input.scope} · ${input.baseline}`,'',tr(['定义草稿及用户选择；来源采用和页面运行效果需另行验证。','Definitions and user decisions; source adoption and runtime appearance require separate verification.'])];for(const d of catalog.categories){const c=state.categories.find(x=>x.id===d.id);lines.push('',`## ${tr(d.label)}`,'',`${t(c.adoption)} · v${c.version} · ${t(c.locked?'locked':'draft')}`,c.reason,``,tr(c.rule),`${tr(['定义字段','Definition fields'])}: ${d.fields.map(f=>tr(f.label)).join(' · ')}`,``,`${t('evidence')}: ${obsLabel(observation(c.id))}`);for(const r of c.rows){lines.push('',`### ${tr(r.label)} — ${r.name}`,'',tr(r.meaning),`${tr(['适用位置','Intended location'])}: ${tr(r.location)}`,`${tr(['范围','Scope'])}: ${tr(r.scope)}`);if(r.binding){for(const f of d.fields)lines.push(`${tr(f.label)}: ${r.binding.values[f.id]}`);lines.push(`${tr(['来源','Owner'])}: ${r.binding.owner} (${r.binding.ownerStatus})`)}else lines.push(t('pending'))}}return lines.join('\n')+'\n'}
function diff(c){const previous=c.history.at(-1);if(!previous)return [];const before=clone(previous),after=snapshot(c);for(const obj of [before,after])for(const key of ['version','locked','stage','confirmedAt'])delete obj[key];return Object.keys(after).filter(k=>JSON.stringify(after[k])!==JSON.stringify(before[k])).map(k=>({field:k,before:before[k],after:after[k]}))}
document.addEventListener('click',ev=>{const n=ev.target.closest('button[data-atom],button[data-action]');if(!n)return;if(n.dataset.atom){atom=n.dataset.atom;render();return}const action=n.dataset.action,id=n.dataset.id;if(action==='cancel'){close();return}if(action==='legacy'){modal(tr(['旧版颜色完整记录','Complete legacy color record']),`<p>${tr(['原记录完整保留，不自动扩展其确认范围。','Original records are retained without extending their confirmed scope.'])}</p><pre>${esc(JSON.stringify(state.legacyColorRecord,null,2))}</pre>`);return}const c=cat();if(!c)return;if(action==='edit'||action==='add'){editBinding(id);return}if(action==='binding'){editBinding(id);return}if(action==='history'){modal(t('history'),c.history.map(v=>`<div class="changed">v${v.version} · ${t(v.adoption)} · ${esc(v.confirmedAt)}${button('download-version',tr(['导出此版本','Export this version']),`data-version="${v.version}"`)}</div>`).join(''));return}if(action==='download-version'){download(c.history.find(v=>v.version===Number(n.dataset.version)),`${input.project}-${atom}-v${n.dataset.version}.json`);return}if(action==='diff'){modal(t('diff'),`<pre>${esc(JSON.stringify(diff(c),null,2))}</pre>`);return}if(action==='define'||action==='bind'){if(action==='bind'&&['unused','defer'].includes(c.adoption))return;c.stage=action;persist();render();return}if(action==='revision'&&c.locked){c.locked=false;c.version++;c.stage='define';persist();render();return}if(c.locked)return;
 if(action==='remove-role'){const index=c.rows.findIndex(r=>r.id===id);if(index<0)return;const [row]=c.rows.splice(index,1);c.removedRows.push({row:clone(row),index,removedAt:new Date().toISOString()});persist();render();return}
 if(action==='undo-remove'){const removed=c.removedRows.at(-1);if(!removed)return;if(state.categories.some(category=>category.rows.some(r=>r.name===removed.row.name))){modal(t('undo'),`<p>${tr(['同名 Token 已存在，请先修改其名称再恢复。','A token with this name already exists. Rename it before restoring.'])}</p>${button('cancel',t('cancel'))}`);return}c.removedRows.pop();c.rows.splice(Math.min(removed.index,c.rows.length),0,removed.row);persist();render();return}
 if(action==='rule'){modal(tr(['本类使用规则','Category use rule']),`<form id="rule-form">${field(tr(['规则','Rule']),'rule-value',tr(c.rule),'textarea')}${footer()}</form>`);document.querySelector('#rule-form').onsubmit=ev=>{ev.preventDefault();const v=document.querySelector('#rule-value').value.trim();if(!v)return;c.rule=[v,v];persist();close();render()};return}
 if(action==='lock'){if(!complete(c))return;modal(t('confirm'),`<p>${esc(tr(def().label))} · ${t(c.adoption)} · v${c.version}</p><p>${tr(['保存当前列表中的 Token 定义。此确认不修改应用源码。','Save the token definitions currently in this list. This confirmation does not modify application source.'])}</p><div class="dialogfoot">${button('cancel',t('cancel'))}${button('confirm-lock',t('confirm'),'class="primary"')}</div>`);return}
 if(action==='confirm-lock'){if(!complete(c))return;c.locked=true;c.history.push({...snapshot(c),confirmedAt:new Date().toISOString()});persist();close();render()}
});
document.querySelector('header .tools').insertAdjacentHTML('beforeend','<a href="framework-styles.css" download style="padding:9px">下载底层样式表</a>');
document.querySelector('#export').onclick=()=>download(exportRecord(),input.project+'-atomic-framework.json');document.querySelector('#manual').onclick=()=>download(manual(),'DESIGN-SYSTEM.md','text/markdown');document.querySelector('#lang').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';persist();render()};persist();render();
